name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.3.0)"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build executable
        run: >
          uv run --with pyinstaller
          pyinstaller
          --onefile
          --console
          --clean
          --noconfirm
          --name yotoize
          --collect-submodules mutagen
          --hidden-import tomli_w
          packaging/entrypoint.py

      # Exercises every top-level import in cli.py (click, mutagen, tqdm,
      # tomli_w, the yotoize modules), so a bundle missing a dependency fails
      # here rather than on a user's machine.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/yotoize --version
          ./dist/yotoize process --help
          ./dist/yotoize config --help

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\yotoize.exe --version
          .\dist\yotoize.exe process --help
          .\dist\yotoize.exe config --help

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          chmod +x yotoize
          tar -czf "yotoize-${{ matrix.target }}.tar.gz" yotoize
          shasum -a 256 "yotoize-${{ matrix.target }}.tar.gz" \
            > "yotoize-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          $archive = "yotoize-${{ matrix.target }}.zip"
          Compress-Archive -Path yotoize.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: yotoize-${{ matrix.target }}
          path: |
            dist/yotoize-*.tar.gz
            dist/yotoize-*.zip
            dist/yotoize-*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Each matrix job uploads its own artifact directory, so flatten first.
          mkdir -p upload
          find artifacts -type f -exec mv -t upload {} +
          ls -l upload

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber upload/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              upload/*
          fi
