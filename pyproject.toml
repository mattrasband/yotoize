[project]
name = "chapterize"
version = "0.1.0"
description = "Extract and split audiobook chapters from embedded metadata"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Matt Rasband" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = ["mutagen>=1.47.0", "click>=8.1.7"]

[project.scripts]
chapterize = "chapterize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
